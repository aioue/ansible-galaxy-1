---
# templates/systemd/galaxy.service.j2 renders the Galaxy systemd unit. It must render without galaxy_root, which
# only the root-dir layout defines, and set HOME only when galaxy_root is defined.
# Regression test for #138: the unit failed to render on layouts other than root-dir.
- name: Test the Galaxy systemd unit
  hosts: localhost
  gather_facts: false
  vars:
    galaxy_systemd_root: true
    galaxy_systemd_mode: gravity
    galaxy_systemd_timeout_start_sec: 300
    galaxy_systemd_command: /srv/galaxy/venv/bin/galaxyctl start
    galaxy_systemd_env: []
    __galaxy_user_name: galaxy
    __galaxy_user_group: galaxy
    galaxy_server_dir: /srv/galaxy/server
    galaxy_venv_dir: /srv/galaxy/venv
    galaxy_dynamic_job_rules_dir: /srv/galaxy/dynamic_rules
    galaxy_gravity_state_dir: /srv/galaxy/var/gravity
    galaxy_config_file: /srv/galaxy/config/galaxy.yml
    __galaxy_systemd_memory_limit_merged:
      mule: 8
  tasks:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: __unit_dir

    - name: Render the unit without galaxy_root
      ansible.builtin.template:
        src: roles/galaxyproject.galaxy/templates/systemd/galaxy.service.j2
        dest: "{{ __unit_dir.path }}/no-root.service"
        mode: "0644"

    - name: Render the unit with galaxy_root
      ansible.builtin.template:
        src: roles/galaxyproject.galaxy/templates/systemd/galaxy.service.j2
        dest: "{{ __unit_dir.path }}/with-root.service"
        mode: "0644"
      vars:
        galaxy_root: /srv/galaxy

    - name: Read the units
      ansible.builtin.slurp:
        src: "{{ __unit_dir.path }}/{{ item }}.service"
      loop:
        - no-root
        - with-root
      register: __units

    - name: Check HOME is set only when galaxy_root is defined
      ansible.builtin.assert:
        that:
          - "'HOME=' not in (__units.results[0].content | b64decode)"
          - "'Environment=HOME=/srv/galaxy\n' in (__units.results[1].content | b64decode)"

    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ __unit_dir.path }}"
        state: absent
