---
# templates/systemd/galaxy.service.j2 and galaxy-reports.service.j2 render the Galaxy and Reports systemd units. They
# must render without galaxy_root, which only the root-dir layout defines, and set HOME only when it is defined.
# Regression test for #138: the unit failed to render on layouts other than root-dir. Also tests that
# galaxy_systemd_extra_directives (#145) lands in the Galaxy unit's [Service] section.
- name: Test the Galaxy systemd unit
  hosts: localhost
  gather_facts: false
  vars:
    galaxy_systemd_root: true
    galaxy_systemd_mode: gravity
    galaxy_systemd_timeout_start_sec: 300
    galaxy_systemd_command: /srv/galaxy/venv/bin/galaxyctl start
    galaxy_systemd_env: []
    galaxy_systemd_extra_directives: []
    __galaxy_user_name: galaxy
    __galaxy_user_group: galaxy
    galaxy_server_dir: /srv/galaxy/server
    galaxy_venv_dir: /srv/galaxy/venv
    galaxy_dynamic_job_rules_dir: /srv/galaxy/dynamic_rules
    galaxy_gravity_state_dir: /srv/galaxy/var/gravity
    galaxy_config_file: /srv/galaxy/config/galaxy.yml
    galaxy_config_style: yaml
    galaxy_reports_path: /srv/galaxy/config/reports.yml
    __galaxy_systemd_memory_limit_merged:
      mule: 8
      reports: 1
  tasks:
    - name: Create a temporary directory
      ansible.builtin.tempfile:
        state: directory
      register: __unit_dir

    - name: Render the units without galaxy_root
      ansible.builtin.template:
        src: roles/galaxyproject.galaxy/templates/systemd/{{ item }}.service.j2
        dest: "{{ __unit_dir.path }}/{{ item }}-no-root.service"
        mode: "0644"
      loop: &units
        - galaxy
        - galaxy-reports

    - name: Render the units with galaxy_root
      ansible.builtin.template:
        src: roles/galaxyproject.galaxy/templates/systemd/{{ item }}.service.j2
        dest: "{{ __unit_dir.path }}/{{ item }}-with-root.service"
        mode: "0644"
      loop: *units
      vars:
        galaxy_root: /srv/galaxy

    - name: Check HOME is set only when galaxy_root is defined
      ansible.builtin.assert:
        that:
          - "'HOME=' not in lookup('ansible.builtin.file', __unit_dir.path ~ '/' ~ item ~ '-no-root.service')"
          - "'Environment=HOME=/srv/galaxy\n' in lookup('ansible.builtin.file', __unit_dir.path ~ '/' ~ item ~ '-with-root.service', rstrip=false)"
      loop: *units

    - name: Render the Galaxy unit with extra directives
      ansible.builtin.template:
        src: roles/galaxyproject.galaxy/templates/systemd/galaxy.service.j2
        dest: "{{ __unit_dir.path }}/galaxy-extra-directives.service"
        mode: "0644"
      vars:
        galaxy_systemd_extra_directives:
          - ProtectSystem=yes
          - NoNewPrivileges=yes

    - name: Check the extra directives are in the Service section
      ansible.builtin.assert:
        that:
          - "'\nProtectSystem=yes\nNoNewPrivileges=yes\n' in __service_section"
          - "'ProtectSystem' not in __unit_text.split('[Service]')[0]"
          - "'ProtectSystem' not in __unit_text.split('[Install]')[1]"
      vars:
        __unit_text: "{{ lookup('ansible.builtin.file', __unit_dir.path ~ '/galaxy-extra-directives.service', rstrip=false) }}"
        __service_section: "{{ __unit_text.split('[Service]')[1].split('[Install]')[0] }}"

    - name: Check the Galaxy unit has no extra directives by default
      ansible.builtin.assert:
        that:
          - "'ProtectSystem' not in lookup('ansible.builtin.file', __unit_dir.path ~ '/galaxy-no-root.service')"

    - name: Remove the temporary directory
      ansible.builtin.file:
        path: "{{ __unit_dir.path }}"
        state: absent
