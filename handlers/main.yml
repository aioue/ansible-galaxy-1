---
# defaults file for galaxyproject.galaxy

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ galaxy_systemd_root | ternary(omit, 'user') }}"
  listen: systemd daemon reload

- name: Start Galaxy systemd service
  ansible.builtin.systemd:
    name: galaxy.service
    state: started
    scope: "{{ galaxy_systemd_root | ternary(omit, 'user') }}"
  when: "galaxy_manage_restart and galaxy_systemd_mode == 'gravity' and galaxy_manage_systemd"
  listen:
    - start galaxy
    - galaxy systemd start

- name: Restart Galaxy mule systemd service
  ansible.builtin.systemd:
    name: galaxy.service
    state: restarted
    scope: "{{ galaxy_systemd_root | ternary(omit, 'user') }}"
  when: "galaxy_manage_restart and galaxy_systemd_mode == 'mule' and galaxy_manage_systemd"
  listen:
    - restart galaxy
    - galaxy mule restart

# Gravity handlers for 22.05
- name: Restart Galaxy with Gravity (22.05)
  ansible.builtin.command: >-
    {{ galaxy_gravity_command }} {{ galaxy_gravity_restart_action }}
    {{ '--start-if-stopped' if (galaxy_gravity_restart_action == 'graceful' and galaxy_gravity_graceful_start_if_stopped) else '' }}
  changed_when: true
  environment:
    GRAVITY_STATE_DIR: "{{ galaxy_gravity_state_dir }}"
  listen:
    - restart galaxy
    - galaxy gravity restart (22.05)
  when: "galaxy_manage_restart and galaxy_systemd_mode == 'gravity' and galaxy_manage_systemd and __galaxy_major_version is version('23.0', '<')"
  become: true
  become_user: "{{ __galaxy_user_name }}"

- name: Update Gravity config with galaxyctl (22.05)
  ansible.builtin.command: "{{ galaxy_gravity_command }} update"
  changed_when: true
  environment:
    GRAVITY_STATE_DIR: "{{ galaxy_gravity_state_dir }}"
  listen:
    - galaxyctl update
    - galaxyctl update (22.05)
  when: "galaxy_manage_restart and galaxy_systemd_mode == 'gravity' and galaxy_manage_systemd and __galaxy_major_version is version('23.0', '<')"
  become: true
  become_user: "{{ __galaxy_user_name }}"

# Gravity handlers for 23.0+
- name: Update Gravity config with galaxyctl (23.0+)
  ansible.builtin.command: "{{ galaxy_gravity_command }} -c {{ galaxy_config_file }} update"
  changed_when: true
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    GRAVITY_STATE_DIR: "{{ galaxy_gravity_state_dir }}"
  listen:
    - galaxyctl update
    - galaxyctl update (23.0+)
  when: "galaxy_manage_restart and galaxy_systemd_mode == 'gravity' and __galaxy_major_version is version('23.0', '>=')"
  become: true
  become_user: "{{ (__galaxy_gravity_pm == 'systemd' and galaxy_systemd_root) | ternary('root', __galaxy_user_name) }}"

- name: Restart Galaxy with Gravity (23.0+)
  ansible.builtin.command: >-
    {{ galaxy_gravity_command }} -c {{ galaxy_config_file }} {{ galaxy_gravity_restart_action }}
    {{ '--start-if-stopped' if (galaxy_gravity_restart_action == 'graceful' and galaxy_gravity_graceful_start_if_stopped) else '' }}
  changed_when: true
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    GRAVITY_STATE_DIR: "{{ galaxy_gravity_state_dir }}"
  listen:
    - restart galaxy
    - galaxy gravity restart (23.0+)
  when: "galaxy_manage_restart and galaxy_systemd_mode == 'gravity' and __galaxy_major_version is version('23.0', '>=')"
  become: true
  become_user: "{{ (__galaxy_gravity_pm == 'systemd' and galaxy_systemd_root) | ternary('root', __galaxy_user_name) }}"
