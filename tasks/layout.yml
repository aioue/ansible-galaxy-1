---
# Configure any unset variables using layout defaults

- name: Include layout vars
  ansible.builtin.include_vars: "layout-{{ galaxy_layout | default('legacy') }}.yml"

- name: Set any unset variables from layout defaults
  ansible.builtin.set_fact:
    "{{ item }}": "{{ lookup('vars', '__' ~ item) }}"
  when: not query('ansible.builtin.varnames', '^' ~ item ~ '$')
  with_items:
    - galaxy_venv_dir
    - galaxy_server_dir
    - galaxy_config_dir
    - galaxy_mutable_data_dir
    - galaxy_mutable_config_dir
    - galaxy_shed_tools_dir
    - galaxy_cache_dir
    - galaxy_local_tools_dir

- name: Check that any explicitly set Galaxy config options match the values of explicitly set variables
  ansible.builtin.assert:
    that:
      - lookup('vars', 'galaxy_' ~ item) == galaxy_config[galaxy_app_config_section][item]
    msg: >-
      Value of '{{ 'galaxy_' ~ item }}' does not match value of '{{ item }}' in galaxy_config:
      {{ lookup('vars', 'galaxy_' ~ item) }} != {{ galaxy_config[galaxy_app_config_section][item] }}
  when:
    - query('ansible.builtin.varnames', '^galaxy_' ~ item ~ '$') | length > 0
    - item in ((galaxy_config | default({}))[galaxy_app_config_section] | default({}))
  with_items:
    - tool_dependency_dir
    - file_path
    - job_working_directory
    - shed_tool_config_file
    - tool_data_path

- name: Set any unset variables corresponding to Galaxy config options from galaxy_config or layout defaults
  ansible.builtin.set_fact:
    "{{ 'galaxy_' ~ item }}": >-
      {{ ((galaxy_config | default({}))[galaxy_app_config_section] | default({}))[item]
      | default(lookup('vars', '__galaxy_' ~ item)) }}
  when: not query('ansible.builtin.varnames', '^galaxy_' ~ item ~ '$')
  with_items:
    - tool_dependency_dir
    - file_path
    - job_working_directory
    - tool_data_path
